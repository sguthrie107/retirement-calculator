<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retirement Dashboard{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=20260311-1">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <h1>🎯 Retirement Calculator Dashboard</h1>
            <p>Track Projected vs Actual Retirement Performance</p>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2026 Retirement Calculator | CLI still available via <code>python calculate.py</code></p>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
