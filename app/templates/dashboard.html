{% extends "base.html" %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<div class="chart-container">
    <canvas id="retirementChart"></canvas>
</div>

<div class="dashboard-controls">
    <div class="control-group">
        <label for="userSelect">Select User:</label>
        <select id="userSelect" onchange="loadUserData()">
            <option value="">-- Select a user --</option>
            {% if users %}
                {% for user in users %}
                <option value="{{ user }}" {% if user == selected_user %}selected{% endif %}>{{ user }}</option>
                {% endfor %}
            {% endif %}
            <option value="all">📊 View All Users</option>
        </select>
    </div>
    
    <div class="control-group">
        <button onclick="showBalanceForm()" class="btn-primary" id="addBalanceBtn" style="display: none;">➕ Add Actual Balance</button>
    </div>
</div>

<div id="deltaTable" class="delta-section">
    <h2>Performance Comparison</h2>
    <div id="deltaContent">
        <p class="loading">Select a user to view comparison data</p>
    </div>
</div>

<!-- Balance entry form modal -->
<div id="balanceModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="hideBalanceForm()">&times;</span>
        <h2>Add Actual Balance</h2>
        <form id="balanceForm" onsubmit="submitBalance(event)">
            <div class="form-group">
                <label for="year">Year:</label>
                <select id="year" required>
                    <option value="">-- Select a year --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="balance401k">401k Balance ($):</label>
                <input type="number" id="balance401k" min="0" step="0.01">
            </div>
            
            <div class="form-group">
                <label for="balanceIRA">Roth IRA Balance ($):</label>
                <input type="number" id="balanceIRA" min="0" step="0.01">
            </div>
            
            <div class="form-group">
                <label for="notes">Notes (optional):</label>
                <textarea id="notes" rows="2"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <button type="button" class="btn-secondary" onclick="hideBalanceForm()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit balance modal -->
<div id="editBalanceModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="hideEditBalanceForm()">&times;</span>
        <h2>Edit Balance Entry</h2>
        <form id="editBalanceForm" onsubmit="submitEditBalance(event)">
            <div class="form-group">
                <label for="editYear">Year:</label>
                <input type="number" id="editYear" min="2000" max="2100" disabled>
            </div>
            
            <div id="balanceFieldsContainer">
                <!-- Will be populated dynamically based on number of balance IDs -->
            </div>
            
            <div class="form-group">
                <label for="editNotes">Notes (optional):</label>
                <textarea id="editNotes" rows="2"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Update</button>
                <button type="button" class="btn-secondary" onclick="hideEditBalanceForm()">Cancel</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/chart.js"></script>
<script>
    // Embed initial data from server
    const initialData = {{ initial_data | tojson | safe }};
    const selectedUserInit = '{{ selected_user }}';
    
    function renderInitialData() {
        try {
            const deltaContent = document.getElementById('deltaContent');
            const chartElement = document.getElementById('retirementChart');
            
            if (!initialData) {
                if (deltaContent) deltaContent.innerHTML = '<p style="color: red;">ERROR: No data from server</p>';
                return;
            }
            
            if (!selectedUserInit) {
                if (deltaContent) deltaContent.innerHTML = '<p style="color: red;">ERROR: No user selected</p>';
                return;
            }
            
            if (!chartElement) {
                if (deltaContent) deltaContent.innerHTML = '<p style="color: red;">ERROR: Chart element not found</p>';
                return;
            }
            
            // Set dropdown value
            const userSelect = document.getElementById('userSelect');
            if (userSelect) {
                userSelect.value = selectedUserInit;
            }
            
            // Show UI elements
            const addBalanceBtn = document.getElementById('addBalanceBtn');
            const deltaTable = document.getElementById('deltaTable');
            if (addBalanceBtn) addBalanceBtn.style.display = 'inline-block';
            if (deltaTable) deltaTable.style.display = 'block';
            
            // Render chart and table
            renderSingleUserChart(selectedUserInit, initialData);
            renderDeltaTable(initialData.deltas);
        } catch (error) {
            const deltaContent = document.getElementById('deltaContent');
            if (deltaContent) {
                deltaContent.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    }
    
    // Render on load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderInitialData);
    } else {
        renderInitialData();
    }
    
    // Multiple timeouts to ensure it runs
    setTimeout(renderInitialData, 50);
    setTimeout(renderInitialData, 200);
</script>
{% endblock %}
