{% extends "base.html" %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<div class="dashboard-controls">
    <div class="control-group">
        <label for="userSelect">Select User:</label>
        <select id="userSelect" onchange="loadUserData()">
            {% if users %}
                {% for user in users %}
                <option value="{{ user }}" {% if user == selected_user %}selected{% endif %}>{{ user }}</option>
                {% endfor %}
            {% else %}
                <option value="">No users found</option>
            {% endif %}
        </select>
    </div>
    
    <div class="control-group">
        <button onclick="showBalanceForm()" class="btn-primary">➕ Add Actual Balance</button>
    </div>
</div>

<div class="chart-container">
    <canvas id="retirementChart"></canvas>
</div>

<div id="deltaTable" class="delta-section">
    <h2>Performance Comparison</h2>
    <div id="deltaContent">
        <p class="loading">Select a user to view comparison data</p>
    </div>
</div>

<!-- Balance entry form modal -->
<div id="balanceModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="hideBalanceForm()">&times;</span>
        <h2>Add Actual Balance</h2>
        <form id="balanceForm" onsubmit="submitBalance(event)">
            <div class="form-group">
                <label for="accountType">Account Type:</label>
                <select id="accountType" required>
                    <option value="401k">401k</option>
                    <option value="roth_ira">Roth IRA</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="year">Year:</label>
                <input type="number" id="year" min="2000" max="2100" value="{{ current_year }}" required>
            </div>
            
            <div class="form-group">
                <label for="balance">Balance ($):</label>
                <input type="number" id="balance" min="0" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="notes">Notes (optional):</label>
                <textarea id="notes" rows="2"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <button type="button" class="btn-secondary" onclick="hideBalanceForm()">Cancel</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/chart.js"></script>
<script>
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
        const selectedUser = '{{ selected_user }}';
        if (selectedUser && selectedUser !== 'None') {
            loadUserData();
        }
    });
</script>
{% endblock %}
